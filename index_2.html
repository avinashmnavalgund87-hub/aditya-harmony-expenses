<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aditya Harmony Monthly Expense</title>
<style>
:root {
  --bg: #f5f6f4; --card: #ffffff; --ink: #1c211e; --muted: #667069; --line: #dfe3dd;
  --accent: #2f6b4f; --danger: #b03a2e; --warn: #b7791f;
  --c1: #2f6b4f; --c2: #d08c3a; --c3: #3f7fb5; --c4: #a24f7a; --c5: #7a8f2e; --c6: #5b5fb8; --c7: #c4553d; --c8: #3c9a9a; --c9: #8a6a4a; --c10: #6d7a86; --c11: #b58f1f; --c12: #4f8a5f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111412; --card: #1a1e1b; --ink: #e8ece8; --muted: #9aa39c; --line: #2c322d;
    --accent: #7fc2a0; --danger: #e8806f; --warn: #e3b25a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111412; --card: #1a1e1b; --ink: #e8ece8; --muted: #9aa39c; --line: #2c322d;
  --accent: #7fc2a0; --danger: #e8806f; --warn: #e3b25a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
.wrap { max-width: 980px; margin: 0 auto; min-width: 0; }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 1.5rem; margin: 0; }
h2 { font-size: 1.05rem; margin: 0 0 12px; }
nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
nav.tabs button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; margin-bottom: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid.two { grid-template-columns: 1fr 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.kpi .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.kpi .value { font-size: 1.5rem; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.split { display: grid; gap: 18px; grid-template-columns: 1fr; align-items: center; }
@media (min-width: 560px) { .split { grid-template-columns: 220px 1fr; } }
.donut { width: 200px; height: 200px; border-radius: 50%; margin: 0 auto; position: relative; }
.donut::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: var(--card); }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; z-index: 1; font-size: 12px; color: var(--muted); }
.donut-center strong { display: block; font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.legend .row { display: grid; grid-template-columns: 12px minmax(0,1fr) auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.legend .row:last-child { border-bottom: 0; }
.sw { width: 12px; height: 12px; border-radius: 3px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.pct { color: var(--muted); font-size: 13px; min-width: 44px; text-align: right; }
.empty { color: var(--muted); font-style: italic; padding: 8px 0; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 150px; }
.bars .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; min-width: 0; }
.bars .fill { width: 100%; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 2px; }
.bars .col.current .fill { background: var(--c2); }
.bars .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; }
.bars .val { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 12px; }
.toolbar label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.btn { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.entry-form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }
.entry-form .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); }
td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td .note { color: var(--muted); font-size: 13px; }
.pending { font-size: 12px; color: var(--warn); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.actions-cell { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.status { font-size: 13px; color: var(--accent); margin: 10px 0 0; min-height: 1em; }
.status.err { color: var(--danger); }
.hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
[hidden] { display: none !important; }
</style>
</head>

const CATEGORIES = [
  "Salaries", "Bank transfers",
  "Housekeeping", "Electricity", "Fuel", "TDS", "Waste Management", "Garden Management", "Security",
  "Quarterly Maintenance Collection", "Water Consumption Charges", "Water Board Maintenance Charges", "AMC",
  "Electrician - In call", "Plumber - In call", "Water Body Maintenance Supply", "Housekeeping Material In ward", "BBMP", "Purchases", "Other"
];
const PAYEES = [
  "SRC", "Ganesh", "BBMP", "BESCOM", "Avinash", "Krishna", "Dinakar",
  "Electrician", "Plumber", "Diesel", "Pradeep", "Mahesh", "Kale Gowda", "Vishwa", "Sharath", "Gowrish", "Shaila SRC"
];
const COLORS = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8","--c9","--c10","--c11","--c12"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const allowed = new Set(ALLOWED_EMAILS.map(e => e.trim().toLowerCase()));

let user = null;
let entries = [];
let bank = {};
let loaded = false;
let unsubs = [];
let view = "home";
let period = null;
let editingId = null;
let filterText = "";
const canWrite = true; // the security rules decide who can actually write

const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const monthKey = d => (d || "").slice(0, 7);
const monthLabel = k => new Date(k + "-01T00:00:00").toLocaleString("en-IN", { month: "long", year: "numeric" });
const monthShort = k => new Date(k + "-01T00:00:00").toLocaleString("en-IN", { month: "short" });
const uid = () => Math.random().toString(36).slice(2, 10);
const byDateDesc = (a, b) => (b.date || "").localeCompare(a.date || "");
const sum = list => list.reduce((s, e) => s + Number(e.amount || 0), 0);
const amountCell = e => e.amount == null ? '<span class="pending">Pending</span>' : inr(e.amount);
const colorOf = i => `var(${COLORS[i % COLORS.length]})`;
const who = e => [e.payee, e.note].filter(Boolean).join(" · ");

function months() {
  const set = new Set(entries.filter(e => e.date).map(e => monthKey(e.date)));
  set.add(monthKey(today()));
  return [...set].sort();
}
function hasUndated() { return entries.some(e => !e.date); }
function periodOptions() { return hasUndated() ? [...months(), "undated"] : months(); }
function currentPeriod() {
  const o = periodOptions();
  if (!o.includes(period)) period = o.includes(monthKey(today())) ? monthKey(today()) : o[o.length - 1];
  return period;
}
function inPeriod(e, p) { return p === "undated" ? !e.date : monthKey(e.date) === p; }
function splitByCategory(list) {
  const t = {};
  list.forEach(e => { t[e.category] = (t[e.category] || 0) + Number(e.amount || 0); });
  return Object.keys(t).map(k => ({ name: k, value: t[k] })).filter(x => x.value > 0).sort((a, b) => b.value - a.value);
}

function setMsg(text, err = false) {
  const el = document.getElementById("status");
  el.textContent = text; el.className = "status" + (err ? " err" : ""); el.hidden = !text;
}
function writeErr(e) {
  const c = e?.code;
  if (c === "permission-denied") return "You don't have permission to change this record.";
  if (c === "resource-exhausted") return "Too many changes at once. Try again shortly.";
  return "Could not save (" + (c || "error") + ").";
}
async function write(promise, okText) {
  try { await promise; setMsg(okText); return true; }
  catch (e) { setMsg(writeErr(e), true); return false; }
}

// ---------- Sign-in ----------
function friendly(e, label) {
  const c = e?.code || "";
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found"].includes(c)) return "Email or password is wrong.";
  if (c === "auth/email-already-in-use") return "That email already has an account. Sign in instead.";
  if (c === "auth/popup-closed-by-user") return "The Google sign-in window was closed.";
  if (c === "auth/weak-password") return "Use a password of at least 6 characters.";
  return label + " (" + (c || "error") + ").";
}
async function run(fn, label) {
  try { await fn(); } catch (e) { setMsg(friendly(e, label), true); }
}

onAuthStateChanged(auth, async u => {
  const email = (u?.email || "").toLowerCase();
  const unverified = u && u.providerData[0]?.providerId === "password" && !u.emailVerified;
  if (u && (!allowed.has(email) || unverified)) {
    const reason = unverified
      ? "Please verify your email first. Check your inbox for the link, then sign in."
      : "This account is not on the access list.";
    await signOut(auth);
    setMsg(reason, true);
    return;
  }
  user = u || null;
  if (user) startData(); else stopData();
  document.querySelector("nav.tabs").hidden = !user;
  document.getElementById("signout").hidden = !user;
  render();
});

function loginView() {
  return `
    <div class="card" style="max-width:420px;margin:24px auto">
      <h2>Sign in</h2>
      <p class="hint" style="margin:0 0 14px">Only approved accounts can open this record.</p>
      <button class="btn primary" id="gbtn" type="button" style="width:100%">Sign in with Google</button>
      <div class="hint" style="text-align:center;margin:14px 0">or with email</div>
      <form id="eform" class="entry-form" style="grid-template-columns:1fr">
        <label class="field">Email<input type="email" name="email" required autocomplete="username"></label>
        <label class="field">Password<input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
        <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn primary" type="submit">Sign in</button>
          <button class="btn" type="button" id="create">Create account</button>
        </div>
      </form>
      <p class="hint">A new email account must verify its address before it can sign in.</p>
    </div>`;
}
function bindLogin() {
  document.getElementById("gbtn").addEventListener("click", () =>
    run(() => signInWithPopup(auth, new GoogleAuthProvider()), "Google sign-in failed"));
  const f = document.getElementById("eform");
  f.addEventListener("submit", ev => {
    ev.preventDefault();
    const d = new FormData(f);
    run(() => signInWithEmailAndPassword(auth, d.get("email").trim(), d.get("password")), "Sign-in failed");
  });
  document.getElementById("create").addEventListener("click", () => {
    if (!f.reportValidity()) return;
    const d = new FormData(f);
    run(async () => {
      const c = await createUserWithEmailAndPassword(auth, d.get("email").trim(), d.get("password"));
      await sendEmailVerification(c.user);
      await signOut(auth);
      setMsg("Account created. We sent a verification link. Verify it, then sign in.");
    }, "Could not create account");
  });
}

// ---------- Data ----------
function startData() {
  stopData();
  unsubs.push(onSnapshot(collection(db, "entries"),
    s => { entries = s.docs.map(d => ({ id: d.id, ...d.data() })); loaded = true; render(); },
    err => { loaded = true; setMsg("Could not load entries (" + (err.code || "error") + ").", true); render(); }));
  unsubs.push(onSnapshot(collection(db, "bank"),
    s => { const b = {}; s.docs.forEach(d => { b[d.id] = d.data(); }); bank = b; render(); },
    () => {}));
}
function stopData() {
  unsubs.forEach(u => u());
  unsubs = [];
  entries = []; bank = {}; loaded = false;
}

// ---------- Views ----------
function bankCard(p) {
  if (p === "undated") return '<div class="card"><h2>Bank summary</h2><p class="empty">Choose a month above to enter its bank figures.</p></div>';
  const b = bank[p] || {};
  const num = v => (v == null || v === "" ? "" : v);
  const opening = Number(b.opening || 0), nobroker = Number(b.nobroker || 0), other = Number(b.other || 0);
  const credits = nobroker + other;
  const spent = sum(entries.filter(e => monthKey(e.date) === p));
  const closing = opening + credits - spent;
  const rows = [
    ["Opening Balance", inr(opening)],
    ["NoBroker collections", inr(nobroker)],
    ["Other bank credits", inr(other)],
    ["Total bank credits", inr(credits)],
    ["Total bank expenditure", inr(spent)],
    ["Closing bank balance", inr(closing)],
    ["Unique flats paying through NoBroker", b.flats ?? "—"],
    ["NoBroker transactions", b.nbTxns ?? "—"]
  ];
  return `
    <div class="card">
      <h2>Bank summary: ${monthLabel(p)}</h2>
      ${canWrite ? `<form id="bankForm" class="entry-form">
        <label class="field">Opening balance (₹)<input type="number" name="opening" step="1" value="${esc(num(b.opening))}"></label>
        <label class="field">NoBroker collections (₹)<input type="number" name="nobroker" min="0" step="1" value="${esc(num(b.nobroker))}"></label>
        <label class="field">Other bank credits (₹)<input type="number" name="other" min="0" step="1" value="${esc(num(b.other))}"></label>
        <label class="field">Unique flats paying via NoBroker<input type="number" name="flats" min="0" step="1" value="${esc(num(b.flats))}"></label>
        <label class="field">NoBroker transactions<input type="number" name="nbTxns" min="0" step="1" value="${esc(num(b.nbTxns))}"></label>
        <div><button class="btn primary" type="submit">Save bank figures</button></div>
      </form>` : ""}
      <div style="margin-top:14px">
        ${rows.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span class="num">${v}</span></div>`).join("")}
      </div>
      <p class="hint">Total bank expenditure adds up this month's entries with amounts. Cash payments are included too, so check before relying on the closing balance.</p>
    </div>`;
}

function homeView() {
  const p = currentPeriod();
  const now = today();
  const thisMonth = entries.filter(e => monthKey(e.date) === monthKey(now));
  const ytd = entries.filter(e => (e.date || "").slice(0, 4) === now.slice(0, 4));
  const shown = entries.filter(e => inPeriod(e, p));
  const split = splitByCategory(shown);
  const total = sum(shown);
  const pending = entries.filter(e => e.amount == null).length;

  let start = 0;
  const stops = split.map((s, i) => {
    const pct = total ? (s.value / total) * 100 : 0;
    const seg = `${colorOf(i)} ${start.toFixed(2)}% ${(start + pct).toFixed(2)}%`;
    start += pct;
    return seg;
  });
  const donut = stops.length ? `conic-gradient(${stops.join(",")})` : "conic-gradient(var(--line) 0 100%)";

  const mList = months().slice(-6);
  const trendMax = Math.max(1, ...mList.map(m => sum(entries.filter(e => monthKey(e.date) === m))));

  return `
    ${bankCard(p)}
    <div class="kpis">
      <div class="kpi"><div class="label">Spent this month</div><div class="value">${inr(sum(thisMonth))}</div><div class="sub">${monthLabel(monthKey(now))}</div></div>
      <div class="kpi"><div class="label">Spent this year</div><div class="value">${inr(sum(ytd))}</div><div class="sub">${now.slice(0, 4)}</div></div>
      <div class="kpi"><div class="label">Entries</div><div class="value">${entries.length}</div><div class="sub">${pending} awaiting amount</div></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="toolbar" style="margin-bottom:16px">
        <label>Period
          <select id="period">${periodOptions().map(m => `<option value="${m}" ${m === p ? "selected" : ""}>${m === "undated" ? "Undated" : monthLabel(m)}</option>`).join("")}</select>
        </label>
      </div>
      <h2>Split by category: ${p === "undated" ? "undated entries" : monthLabel(p)}</h2>
      ${split.length ? `
      <div class="split">
        <div class="donut" style="background:${donut}">
          <div class="donut-center"><div>Total<strong>${inr(total)}</strong></div></div>
        </div>
        <div class="legend">
          ${split.map((s, i) => `
            <div class="row">
              <span class="sw" style="background:${colorOf(i)}"></span>
              <span>${esc(s.name)}</span>
              <span class="num">${inr(s.value)}</span>
              <span class="pct">${total ? ((s.value / total) * 100).toFixed(1) : "0.0"}%</span>
            </div>`).join("")}
        </div>
      </div>
      <p class="hint">${shown.filter(e => e.amount == null).length} entries in this period have no amount yet and are not counted.</p>`
      : '<p class="empty">No amounts recorded for this period yet. Add entries on the Daily entries tab.</p>'}
    </div>

    <div class="grid two">
      <div class="card">
        <h2>Last six months</h2>
        <div class="bars">
          ${mList.map(m => {
            const t = sum(entries.filter(e => monthKey(e.date) === m));
            return `<div class="col ${m === monthKey(now) ? "current" : ""}"><span class="val">${inr(t)}</span><div class="fill" style="height:${(t / trendMax) * 80}%"></div><span class="lbl">${monthShort(m)}</span></div>`;
          }).join("")}
        </div>
      </div>
      <div class="card">
        <h2>Latest entries</h2>
        ${entries.length ? entries.slice().sort(byDateDesc).slice(0, 6).map(e => `
          <div class="kv" style="align-items:flex-start">
            <div style="min-width:0"><div>${esc(e.category)}</div><div class="hint" style="margin:0">${esc(e.date) || "Undated"}${e.payee ? " · " + esc(e.payee) : ""}</div></div>
            <div class="num">${amountCell(e)}</div>
          </div>`).join("") : '<p class="empty">No entries yet.</p>'}
      </div>
    </div>`;
}

function entriesView() {
  const e0 = editingId ? entries.find(x => x.id === editingId) : null;
  const q = filterText.toLowerCase();
  const p = currentPeriod();
  const list = entries
    .filter(e => (q ? [e.category, e.payee, e.note, e.date].join(" ").toLowerCase().includes(q) : inPeriod(e, p)))
    .sort(byDateDesc);

  const form = `
    <div class="card">
      <h2>${e0 ? "Edit entry" : "Add a daily entry"}</h2>
      <form id="form" class="entry-form">
        <label class="field">Date<input type="date" name="date" value="${esc(e0 ? e0.date : today())}"></label>
        <label class="field">Category<select name="category">${CATEGORIES.map(c => `<option ${e0?.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
        <label class="field">Paid to / by<input type="text" name="payee" list="payees" maxlength="80" value="${esc(e0?.payee || "")}"><datalist id="payees">${PAYEES.map(p => `<option value="${esc(p)}">`).join("")}</datalist></label>
        <label class="field">Amount (₹)<input type="number" name="amount" min="0" step="1" placeholder="Blank if pending" value="${esc(e0?.amount ?? "")}"></label>
        <label class="field">Note<input type="text" name="note" maxlength="120" value="${esc(e0?.note || "")}"></label>
        <div class="actions">
          <button class="btn primary" type="submit">${e0 ? "Save changes" : "Add entry"}</button>
          ${e0 ? '<button class="btn" type="button" id="cancel">Cancel</button>' : ""}
        </div>
      </form>
    </div>`;

  return `
    ${form}
    <div class="card">
      <div class="toolbar">
        ${q ? "" : `<label>Period<select id="period">${periodOptions().map(m => `<option value="${m}" ${m === p ? "selected" : ""}>${m === "undated" ? "Undated" : monthLabel(m)}</option>`).join("")}</select></label>`}
        <label style="flex:1;min-width:160px">Search<input type="search" id="search" placeholder="Category, payee, note" value="${esc(filterText)}"></label>
      </div>
      <div class="tablewrap">
        ${list.length ? `<table>
          <thead><tr><th>Date</th><th>Category</th><th style="text-align:right">Amount</th><th></th></tr></thead>
          <tbody>${list.map(e => `<tr>
            <td>${esc(e.date) || '<span class="pending">Undated</span>'}</td>
            <td>${esc(e.category)}${who(e) ? `<div class="note">${esc(who(e))}</div>` : ""}</td>
            <td class="num">${amountCell(e)}</td>
            <td><div class="actions-cell"><button class="btn small" data-edit="${e.id}">Edit</button><button class="btn small danger" data-del="${e.id}">Delete</button></div></td>
          </tr>`).join("")}</tbody>
        </table>` : '<p class="empty">No entries match.</p>'}
      </div>
    </div>`;
}

function render() {
  document.querySelectorAll('[role="tab"]').forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === view)));
  const appEl = document.getElementById("app");
  if (!user) { appEl.innerHTML = loginView(); bindLogin(); return; }
  if (!loaded) { appEl.innerHTML = '<p class="empty">Loading entries…</p>'; return; }
  appEl.innerHTML = view === "home" ? homeView() : entriesView();
  bind();
}

function bind() {
  const per = document.getElementById("period");
  if (per) per.addEventListener("change", () => { period = per.value; render(); });

  const search = document.getElementById("search");
  if (search) search.addEventListener("input", () => {
    filterText = search.value; render();
    const s = document.getElementById("search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length);
  });

  const bf = document.getElementById("bankForm");
  if (bf) bf.addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = new FormData(bf);
    const p = currentPeriod();
    const n = k => { const v = String(f.get(k) || "").trim(); return v === "" ? null : Number(v); };
    await write(setDoc(doc(db, "bank", p), { opening: n("opening"), nobroker: n("nobroker"), other: n("other"), flats: n("flats"), nbTxns: n("nbTxns") }), "Bank figures saved.");
  });

  const form = document.getElementById("form");
  if (form) form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = new FormData(form);
    const raw = String(f.get("amount") || "").trim();
    const amount = raw === "" ? null : Number(raw);
    if (amount !== null && !(amount >= 0)) { setMsg("Enter a valid amount, or leave it blank.", true); return; }
    const wasEditing = editingId;
    const entry = {
      date: String(f.get("date") || ""),
      category: String(f.get("category")),
      payee: String(f.get("payee") || "").trim(),
      amount,
      note: String(f.get("note") || "").trim()
    };
    const id = editingId || uid();
    const ok = await write(setDoc(doc(db, "entries", id), entry), wasEditing ? "Entry updated." : "Entry added.");
    if (ok) { editingId = null; render(); }
  });

  const cancel = document.getElementById("cancel");
  if (cancel) cancel.addEventListener("click", () => { editingId = null; setMsg(""); render(); });

  document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => {
    editingId = b.dataset.edit; setMsg(""); view = "entries"; render();
    document.getElementById("form")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    if (b.dataset.armed !== "1") {
      b.dataset.armed = "1"; b.textContent = "Confirm";
      setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "Delete"; } }, 4000);
      return;
    }
    await write(deleteDoc(doc(db, "entries", b.dataset.del)), "Entry deleted.");
  }));
}

document.querySelectorAll('[role="tab"]').forEach(t => t.addEventListener("click", () => {
  view = t.dataset.view; setMsg(""); render();
}));

document.getElementById("signout").addEventListener("click", () => signOut(auth));

render();

</script>
</body>
</html>
